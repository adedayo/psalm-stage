[package]
name = "psalm-stage"
version = "0.1.0"
description = "Psalm Stage — Worship live multitrack, click, and MIDI performance app"
authors = ["Psalm Stage Contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
psalm-audio-core = { path = "../crates/psalm-audio-core" }
midir = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
