<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <radialGradient id="bannerBg" cx="17%" cy="55%" r="75%">
      <stop offset="0%" stop-color="#261d12" />
      <stop offset="48%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#030304" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <linearGradient id="archGold" x1="256" y1="400" x2="256" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="82%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="archBeam" x1="256" y1="370" x2="256" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="playGrad" x1="230" y1="264" x2="294" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

  </defs>

  <rect width="960" height="240" rx="20" fill="url(#bannerBg)" stroke="#27272a" stroke-width="1.5" />

  <g transform="translate(36, 24) scale(0.375)">
    
  <g transform="translate(0, -18)">
    <!-- Subtle Stage Spotlight Cone -->
    <polygon points="150,372 362,372 456,38 56,38" fill="url(#archBeam)" />

    <!-- 3 Bold Concentric Sanctuary Acoustic Arches -->
    <path d="M 54 336 A 202 202 0 0 1 458 336" fill="none" stroke="url(#archGold)" stroke-width="32" stroke-linecap="round" opacity="0.52" />
    <path d="M 114 336 A 142 142 0 0 1 398 336" fill="none" stroke="url(#archGold)" stroke-width="34" stroke-linecap="round" opacity="0.82" />
    <path d="M 174 336 A 82 82 0 0 1 338 336" fill="none" stroke="url(#archGold)" stroke-width="36" stroke-linecap="round" />

    <!-- Center Stage Play Portal -->
    <path d="M 235 270 C 235 264, 241 261, 246 264 L 296 294 C 301 297, 301 305, 296 308 L 246 338 C 241 341, 235 338, 235 332 Z" fill="url(#playGrad)" />

    <!-- Stage Deck Horizon Bar with Emerald Live Sync LED -->
    <rect x="38" y="376" width="436" height="28" rx="14" fill="url(#archGold)" />
    <rect x="196" y="384" width="120" height="12" rx="6" fill="#09090b" opacity="0.85" />
    <circle cx="256" cy="390" r="4.5" fill="#10b981" />

    <!-- 4/4 Metronome Click Pulse Dots -->
    <circle cx="178" cy="436" r="10" fill="#fef08a" />
    <circle cx="230" cy="436" r="7.5" fill="#f59e0b" opacity="0.75" />
    <circle cx="282" cy="436" r="7.5" fill="#f59e0b" opacity="0.75" />
    <circle cx="334" cy="436" r="7.5" fill="#f59e0b" opacity="0.75" />
  </g>

  </g>

  <g transform="translate(248, 0)">
    <text x="0" y="96"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Inter', sans-serif"
          font-size="52"
          font-weight="800"
          letter-spacing="0.06em">
      <tspan fill="#f4f4f5">PSALM </tspan>
      <tspan fill="url(#goldText)">STAGE</tspan>
    </text>

    <text x="2" y="132"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Inter', sans-serif"
          font-size="14.5"
          font-weight="600"
          letter-spacing="0.22em"
          fill="#a1a1aa">
      LIVE WORSHIP MULTITRACK CONTROLLER
    </text>

    <g transform="translate(2, 158)">
      <g transform="translate(0, 0)">
        <rect width="84" height="25" rx="12.5" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
        <text x="42" y="16.5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e4e4e7" text-anchor="middle">TAURI v2</text>
      </g>
      <g transform="translate(94, 0)">
        <rect width="96" height="25" rx="12.5" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
        <text x="48" y="16.5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f97316" text-anchor="middle">RUST AUDIO</text>
      </g>
      <g transform="translate(200, 0)">
        <rect width="112" height="25" rx="12.5" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
        <circle cx="16" cy="12.5" r="3.5" fill="#10b981" />
        <text x="64" y="16.5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle">0 ms NATIVE</text>
      </g>
      <g transform="translate(322, 0)">
        <rect width="108" height="25" rx="12.5" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
        <text x="54" y="16.5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">OPEN STEMS</text>
      </g>
      <g transform="translate(440, 0)">
        <rect width="90" height="25" rx="12.5" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
        <text x="45" y="16.5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">MIDI OMNI</text>
      </g>
    </g>
