name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build Verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Run Rust workspace unit tests
        run: cargo test --workspace

      - name: Run Angular frontend unit tests
        run: npx ng test --watch=false

      - name: Verify Angular production build
        run: npm run build

  website:
    name: Verify Website & Docs Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Verify documentation is in sync with manifests & CLI
        if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        run: node scripts/sync-docs.mjs --check

      - name: Build Astro + Starlight site
        working-directory: website
        run: npm run build
