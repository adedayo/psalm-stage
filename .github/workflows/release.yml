name: Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-13' # Intel x86_64
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'Psalm Stage ${{ github.ref_name || inputs.tag }}'
          releaseBody: |
            ## Psalm Stage Release ${{ github.ref_name || inputs.tag }}

            Turnkey desktop multitrack player and stage controller for live worship teams. No developer setup or command-line tools required!

            ### Download Links
            * **macOS (Apple Silicon M1/M2/M3/M4)**: Download the `.dmg` (`aarch64-apple-darwin`)
            * **macOS (Intel Core i5/i7/i9)**: Download the `.dmg` (`x86_64-apple-darwin`)
            * **Windows 10 / 11**: Download the `.exe` (NSIS) or `.msi` (Windows Installer)
            * **Linux**: Download the `.AppImage` or `.deb`

            ### Quick Installation
            * **macOS**: Open the `.dmg` file and drag **Psalm Stage** into your **Applications** folder.
            * **Windows**: Run the `.exe` installer and follow the on-screen prompts. A desktop shortcut will be created.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

