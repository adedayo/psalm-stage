name: Release Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
  workflow_call:
    inputs:
      tag:
        description: 'Release tag created by Release Please'
        required: true
        type: string
      skip_release_body:
        description: 'Preserve release notes already generated by Release Please'
        required: false
        type: boolean
        default: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            rust_target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            rust_target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            rust_target: ''
            args: ''
          - platform: 'ubuntu-22.04'
            rust_target: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build bundled CLI & MCP sidecar
        run: node scripts/prepare-cli-sidecar.mjs ${{ matrix.args }}

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.skip_release_body && '' || format('Psalm Stage {0}', inputs.tag || github.ref_name) }}
          releaseBody: ${{ inputs.skip_release_body && '' || format('## Psalm Stage Release {0}\n\nTurnkey desktop multitrack player and stage controller for live worship teams. No developer setup or command-line tools required!\n\n### Download Links\n* **macOS (Apple Silicon M1/M2/M3/M4)**: Download the `.dmg` (`aarch64`)\n* **macOS (Intel Core i5/i7/i9)**: Download the `.dmg` (`x64`)\n* **Windows 10 / 11**: Download the `.exe` (NSIS) or `.msi` (Windows Installer)\n* **Linux**: Download the `.AppImage` or `.deb`\n\n### Quick Installation\n* **macOS**: Open the `.dmg` file and drag **Psalm Stage** into your **Applications** folder (see [Website Installation Guide](https://adedayo.github.io/psalm-stage/getting-started/installation/) for macOS Gatekeeper / one-line install).\n* **Windows**: Run the `.exe` installer and follow the on-screen prompts. A desktop shortcut will be created.', inputs.tag || github.ref_name) }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
